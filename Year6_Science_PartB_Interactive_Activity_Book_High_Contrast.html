<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Science Lab: Measurement Mission</title><style>
:root{--ink:#293451;--purple:#6746c8;--teal:#0d9c99;--pink:#f26085;--yellow:#ffc95a;--bg:#f6f6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#e7e4ff,transparent 35%),var(--bg);color:var(--ink);font-family:'Trebuchet MS',Arial,sans-serif}.app{max-width:1040px;margin:auto;padding:18px 20px 45px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-weight:900;color:var(--purple);font-size:20px}.chip{background:#fff;border:2px solid #ded9f7;border-radius:99px;padding:9px 14px;font-weight:800}.progress{height:13px;border-radius:20px;background:#dddaf0;overflow:hidden;margin:15px 0 23px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--purple));transition:width .3s}.screen{background:white;border-radius:26px;box-shadow:0 16px 40px #3634661b;border:2px solid #e8e5f8;padding:clamp(22px,4vw,44px);min-height:540px}.eyebrow{color:var(--teal);font-size:14px;letter-spacing:2px;font-weight:900;text-transform:uppercase}.title{font-size:clamp(32px,5vw,51px);line-height:1.1;margin:13px 0;color:var(--purple)}.intro{font-size:21px;line-height:1.55;max-width:750px}.tag{display:inline-block;background:#fff0c9;border-radius:12px;padding:10px 14px;font-weight:800;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:20px 0}.tile{border:3px solid #e5e1f6;background:#fbfaff;border-radius:20px;padding:18px;text-align:center;transition:.2s;cursor:pointer;color:var(--ink);font:inherit}.tile:hover,.tile:focus{transform:translateY(-2px);border-color:var(--purple)}.tile.selected{border-color:var(--teal);background:#e9faf6}.tile img{height:220px;max-width:100%;object-fit:contain;display:block;margin:auto}.tile strong{font-size:22px;display:block;margin:12px}.btn{border:0;border-radius:15px;padding:14px 23px;background:var(--purple);color:white;font-size:18px;font-weight:900;cursor:pointer}.btn:hover{filter:brightness(1.1)}.btn.secondary{background:#eae6ff;color:var(--purple)}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:26px}.feedback{margin-top:18px;padding:17px;border-radius:16px;background:#e7f9f3;border-left:6px solid var(--teal);font-size:19px;line-height:1.45}.feedback.error{background:#fff1ef;border-color:var(--pink)}.question{font-size:25px;font-weight:900;line-height:1.4;margin:22px 0}.answer{width:100%;padding:14px;border:2px solid #c9c4e5;border-radius:13px;font-size:20px}.option{display:block;text-align:left;width:100%;margin:10px 0;background:#f6f4ff;border:2px solid #ded8fa;border-radius:14px;padding:17px;font-size:20px;cursor:pointer}.option.chosen{border-color:var(--purple);background:#eee9ff}.lesson{display:flex;gap:20px;align-items:center;background:#f0f9f7;border-radius:18px;padding:20px;margin:20px 0}.lesson img{width:170px;height:200px;object-fit:contain}.lesson p{font-size:21px;line-height:1.5}.mini{font-size:16px;color:#5d6478}.table{width:100%;border-collapse:collapse;margin-top:20px;font-size:19px}.table th{background:var(--purple);color:white}.table td,.table th{padding:14px;border:2px solid #dedaf2;text-align:left}.table input{width:100%;font:inherit;border:1px solid #c9c4e5;padding:10px;border-radius:8px}.temp{display:flex;gap:20px;align-items:center;justify-content:center;background:#eff5ff;border-radius:18px;padding:22px;margin:20px 0}.thermo{width:86px;height:230px;position:relative}.tube{height:195px;width:30px;border:5px solid #71789e;border-radius:22px;background:#fff;position:absolute;left:25px;top:0;overflow:hidden}.red{background:#ef5471;position:absolute;bottom:0;width:100%;height:var(--fill)}.bulb{position:absolute;bottom:0;left:15px;width:50px;height:50px;border:5px solid #71789e;border-radius:50%;background:#ef5471}.readout{background:#fff;border:3px solid #d1d9ff;border-radius:16px;padding:20px;font-size:36px;font-weight:900;color:var(--purple)}.badge{display:inline-block;background:#ffe2a4;border-radius:99px;padding:9px 16px;font-weight:900}.stars{font-size:65px;letter-spacing:12px}.print-note{font-size:15px;color:#687087}@media(max-width:650px){.grid{grid-template-columns:1fr}.lesson{flex-direction:column}.tile img{height:165px}.screen{min-height:500px}.app{padding:10px}.temp{flex-wrap:wrap}}@media print{header,.progress,.actions{display:none}.screen{box-shadow:none;border:0}}

/* Accessibility fix: explicit dark text on pale panels, including browser dark mode. */

.option{background:#f6f4ff!important;}
.option.chosen{background:#eee9ff!important;}
.readout{background:#ffffff!important;color:#49329c!important;}
.temp{background:#eaf2ff!important;}
.table input{background:#ffffff!important;}
.option:focus-visible{outline:4px solid #0d9c99;outline-offset:2px;}

let step=0, score=0, selected=null, checked=false, saved={}, awarded={};
const el=document.getElementById('screen');
function render(){selected=null;checked=false;document.getElementById('status').textContent=step===7?'Mission complete!':`Mission ${step+1} of 7`;document.getElementById('bar').style.width=`${step/7*100}%`;
const nav=(back=true,next=true)=>`<div class="actions"><button class="btn secondary" onclick="go(${Math.max(0,step-1)})" ${back?'':'disabled'}>← Back</button>${next?`<button class="btn" id="next" onclick="go(${step+1})">Next mission →</button>`:''}</div>`;
if(step===0)el.innerHTML=`<div class="eyebrow">Independent activity book • Part B</div><h1 class="title">Measurement Mission! 🔬</h1><p class="intro">Welcome, scientist! You are training to choose the right equipment and record temperature results. Read, click, try and check your answers as you go.</p><div class="grid"><div class="tile" style="cursor:default"><div style="font-size:55px">🧪</div><strong>Mission A</strong>Choose equipment</div><div class="tile" style="cursor:default"><div style="font-size:55px">🌡️</div><strong>Mission B</strong>Record temperature</div></div><div class="tag">You need: 20 minutes • No printing • Work at your own pace</div>${nav(false)}`;
if(step===1)el.innerHTML=`<div class="eyebrow">Learn • Equipment</div><h1 class="title">Meet the measuring tools</h1><p class="intro">Both tools can hold water. But they have different jobs.</p><div class="grid"><div class="tile" style="cursor:default"><img src="${imgs.beaker}"><strong>Beaker</strong><p>Useful for holding, mixing and pouring liquids. Measurements are often approximate.</p></div><div class="tile" style="cursor:default"><img src="${imgs.cylinder}"><strong>Measuring cylinder</strong><p>Designed to measure liquid volume. Smaller marked steps can give more precise measurements.</p></div></div><div class="tag">Key word: precise = measured in finer detail</div>${nav()}`;
if(step===2)el.innerHTML=`<div class="eyebrow">Try it • Choose one</div><h1 class="title">Which tool wins?</h1><p class="question">You need to measure 45 mL of water as precisely as possible. Which tool would you choose?</p><div class="grid"><button class="tile" id="beaker" onclick="pick('beaker')"><img src="${imgs.beaker}"><strong>Beaker</strong></button><button class="tile" id="cylinder" onclick="pick('cylinder')"><img src="${imgs.cylinder}"><strong>Measuring cylinder</strong></button></div><button class="btn" onclick="checkChoice()">Check my choice ✓</button><div id="feedback"></div>${nav()}`;
if(step===3)el.innerHTML=`<div class="eyebrow">Think like a scientist</div><h1 class="title">Explain your choice</h1><p class="question">Why is a measuring cylinder usually better for measuring a precise amount of water?</p><button class="option" onclick="chooseOption(this,'a')">A. It is taller and looks more scientific.</button><button class="option" onclick="chooseOption(this,'b')">B. It has smaller measurement markings, allowing a more detailed reading.</button><button class="option" onclick="chooseOption(this,'c')">C. It makes water colder.</button><button class="btn" onclick="checkOption('b')">Check my answer ✓</button><div id="feedback"></div>${nav()}`;
if(step===4)el.innerHTML=`<div class="eyebrow">Learn • Temperature</div><h1 class="title">A freezing investigation ❄️</h1><div class="lesson"><img src="${imgs.thermometer}"><div><p>Scientists put a small container of water in a freezer. They record the temperature at different times.</p><p>Temperature is recorded in <strong>degrees Celsius (°C)</strong>.</p><p>As the water cools, its temperature generally falls.</p></div></div><div class="tag">Remember: write the number AND the unit, e.g. 8°C.</div>${nav()}`;
if(step===5)el.innerHTML=`<div class="eyebrow">Try it • Temperature</div><h1 class="title">Temperature detective</h1><p class="intro">These are practice readings from an imaginary freezing investigation. Choose the correct unit for each temperature.</p><div class="temp"><div class="thermo"><div class="tube"><div class="red" style="--fill:45%"></div></div><div class="bulb"></div></div><div><div class="mini">At 10 minutes</div><div class="readout">8 ___</div></div></div><p class="question">Which is the correct way to record this temperature?</p><button class="option" onclick="chooseOption(this,'a')">8 mL</button><button class="option" onclick="chooseOption(this,'b')">8°C</button><button class="option" onclick="chooseOption(this,'c')">8 g</button><button class="btn" onclick="checkOption('b')">Check my answer ✓</button><div id="feedback"></div>${nav()}`;
if(step===6)el.innerHTML=`<div class="eyebrow">Your final task • Record data</div><h1 class="title">Complete the results table</h1><p class="intro">The scientist recorded <strong>20°C</strong> at 0 minutes, <strong>8°C</strong> at 10 minutes and <strong>0°C</strong> at 20 minutes. Type the missing temperatures. Include the unit!</p><table class="table"><tr><th>Time (minutes)</th><th>Temperature (°C)</th></tr><tr><td>0</td><td><input id="v0" placeholder="e.g. 12°C" autocomplete="off"></td></tr><tr><td>10</td><td><input id="v1" placeholder="Temperature" autocomplete="off"></td></tr><tr><td>20</td><td><input id="v2" placeholder="Temperature" autocomplete="off"></td></tr></table><div style="margin-top:20px"><button class="btn" onclick="checkTable()">Check my table ✓</button></div><div id="feedback"></div>${nav()}`;
if(step===7)el.innerHTML=`<div class="eyebrow">Mission complete!</div><h1 class="title">You've earned your lab badge! 🏅</h1><div class="stars">⭐ 🔬 ⭐</div><p class="intro">You practised choosing equipment, explaining precision and recording temperatures with units.</p><div class="tag">Self-check score: ${score} / 4</div><p class="intro">Before your assessment, remember: <strong>choose suitable equipment</strong>, <strong>explain why</strong> and <strong>record °C correctly</strong>.</p><div class="actions"><button class="btn secondary" onclick="go(0);score=0;awarded={}">Restart mission ↺</button><button class="btn" onclick="window.print()">Print this badge 🖨</button></div><p class="print-note">Practice examples are different from your actual assessment questions.</p>`;
}
function go(n){step=n;render();window.scrollTo(0,0)}
function pick(v){selected=v;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));document.getElementById(v).classList.add('selected')}
function result(ok,good,bad){const f=document.getElementById('feedback');f.className='feedback'+(ok?'':' error');f.innerHTML=ok?`✅ ${good}`:`💡 ${bad}`;if(ok&&!awarded[step]){score++;awarded[step]=true}}
function checkChoice(){if(!selected)return result(false,'','Choose a tool first.');result(selected==='cylinder','Correct! A suitable measuring cylinder has finer graduations, helping you measure volume more precisely.','Try again. A beaker is usually for holding and mixing; the cylinder is designed for measuring volume.')}
function chooseOption(btn,v){selected=v;document.querySelectorAll('.option').forEach(x=>x.classList.remove('chosen'));btn.classList.add('chosen')}
function checkOption(answer){if(!selected)return result(false,'','Choose an answer first.');result(selected===answer,'Correct! That is exactly what a scientist should record or explain.','Not quite. Look for smaller marked steps when comparing equipment, and °C for temperature.')}
function checkTable(){let vals=['20','8','0'];let ok=vals.every((v,i)=>document.getElementById('v'+i).value.replace(/\s/g,'').toLowerCase()===v+'°c');result(ok,'Great work! All three temperatures have the correct values and units.','Check each value and include °C. Example: 20°C. You can try again.')}
render();</script></body></html>
