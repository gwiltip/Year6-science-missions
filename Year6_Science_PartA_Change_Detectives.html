<!DOCTYPE html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Detectives</title><style>
:root{--ink:#263353;--purple:#6747c8;--mint:#c9f5e6;--pink:#ffe0e7;--yellow:#fff0ad;--blue:#dceaff;--white:#fff;--shadow:0 12px 35px #28335c18}
*{box-sizing:border-box}body{margin:0;font-family:'Trebuchet MS',Arial,sans-serif;background:radial-gradient(circle at 10% 10%,#d8f8f0,transparent 35%),radial-gradient(circle at 85% 15%,#e6ddff,transparent 40%),#f8f9ff;color:var(--ink);min-height:100vh}
header{background:linear-gradient(110deg,#5840b7,#8d60df);color:white;padding:20px 6%;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{font-size:18px;font-weight:900;letter-spacing:.04em}.pill{background:#ffffff30;padding:9px 14px;border-radius:30px;font-weight:bold;font-size:13px}
main{max-width:1000px;margin:25px auto;padding:0 20px 50px}.progress{height:14px;background:#e6e3f6;border-radius:20px;overflow:hidden;margin:10px 0 22px}.bar{height:100%;background:linear-gradient(90deg,#2bc8b4,#9e76f1);width:0;transition:.35s}
.panel{background:white;border:2px solid #ece7fb;border-radius:28px;box-shadow:var(--shadow);padding:clamp(22px,4vw,42px)}.eyebrow{color:#7654c8;font-weight:900;letter-spacing:.12em;font-size:13px;text-transform:uppercase}h1{font-size:clamp(30px,4vw,44px);margin:8px 0 16px}p{font-size:19px;line-height:1.55}h2{font-size:27px}
.art{background:linear-gradient(120deg,#e9f8ff,#f6e7ff);border-radius:22px;padding:16px;display:flex;align-items:center;justify-content:center;min-height:130px;gap:20px;font-size:60px;margin:18px 0}.art span{filter:drop-shadow(0 5px 1px #0001)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:20px 0}.choice{border:3px solid #e6e4f6;border-radius:18px;background:#fafaff;padding:20px;min-height:95px;font:700 19px 'Trebuchet MS',Arial;color:var(--ink);cursor:pointer;text-align:left;transition:.15s}.choice:hover,.choice:focus-visible{border-color:#8664e0;background:#f0eaff;transform:translateY(-2px)}.choice.selected{border-color:#5c43c5;background:#ece6ff}.choice:disabled{cursor:default;transform:none}
button.primary{border:0;border-radius:16px;background:#6747c8;color:white;padding:16px 28px;font-size:18px;font-weight:900;cursor:pointer}button.primary:hover{background:#4d329e}button.secondary{background:white;color:#6244bf;border:2px solid #cabcf5;border-radius:16px;padding:14px 20px;font-size:16px;font-weight:800;cursor:pointer}
.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px}.feedback{padding:17px 20px;border-radius:16px;margin-top:18px;font-size:18px;line-height:1.45;background:#e8faf1;border:2px solid #93e3bb}.feedback.try{background:#fff4d3;border-color:#f4d782}.tip{background:#fff5cf;padding:17px 20px;border-radius:16px;font-size:18px;line-height:1.5;margin:15px 0}.note{background:#e9f0ff;padding:17px 20px;border-radius:16px;margin:15px 0;font-size:18px}.tiny{font-size:14px;color:#65708e}.textanswer{width:100%;padding:16px;border:2px solid #c8bbed;border-radius:15px;font-size:19px;color:var(--ink);background:white}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:18px;margin:18px 0}td,th{padding:14px;border:2px solid #ddd6f5;text-align:left}th{background:#e8e0ff}.scenario{background:#f2efff;padding:20px;border-radius:19px;font-size:18px;line-height:1.55}.score{font-size:52px;font-weight:900;color:#6344c1;text-align:center}.footer{text-align:center;color:#67718d;font-size:13px;margin-top:20px}@media(max-width:600px){header{padding:15px}.pill{font-size:11px}.panel{padding:20px}.art{font-size:45px}.choice{min-height:75px}}
</style></head><body><header><div class="brand">🔬 YEAR 6 SCIENCE LAB</div><div class="pill">PART A · CHANGES</div></header><main><div id="counter" class="eyebrow">Mission 1</div><div class="progress"><div id="bar" class="bar"></div></div><section class="panel" id="panel"></section><div class="footer">Independent Science Mission · Practice questions are different from the assessment · Works offline</div></main><script>
const DATA={"steps": [{"label": "WELCOME", "title": "Change Detectives!", "art": "🧊 🍪 🧪", "body": "Your mission: investigate what happens when materials change. Read each clue, choose or write an answer, then check your thinking. You can use your Science book for longer answers.", "type": "choice", "options": ["Start investigating! 🔍", "Skip the science"], "correct": 0, "correctFeedback": "Detective badge unlocked! Let's investigate."}, {"label": "LEARN", "title": "Can we change it back?", "art": "🧊 💧 🧊", "body": "<strong>Reversible change:</strong> A material can be changed back to its original form. Ice melting into water and freezing again is an example.<br><br><strong>Irreversible change:</strong> We cannot easily return the material to its original form. Baking a cake is an example.", "type": "choice", "options": ["Melting ice is reversible", "Baking a cake is reversible"], "correct": 0, "correctFeedback": "Correct! Water can be frozen into ice again.", "retryFeedback": "Think about whether water can become ice again."}, {"label": "PHOTO CLUE", "title": "Before and after: cake", "art": "🥣 🎂", "body": "Imagine a bowl of cake batter before baking and a cooked cake afterwards. Look for changes in <strong>texture, shape and appearance</strong>.", "type": "text", "placeholder": "The batter was... After baking, the cake...", "model": "The batter is wet and runny, while the baked cake is firmer and holds its shape. Baking causes an irreversible change."}, {"label": "PHOTO CLUE", "title": "Before and after: dough", "art": "🍪 🫓", "body": "A ball of biscuit dough is pressed into a flat shape. It is still uncooked dough.", "type": "choice", "options": ["The material has changed shape, but is still dough", "The dough has turned into a new baked biscuit"], "correct": 0, "correctFeedback": "Yes. Reshaping uncooked dough is usually reversible.", "retryFeedback": "Nothing was baked: only the shape changed."}, {"label": "COMPARE", "title": "What is similar? What is different?", "art": "🧊 🍳", "body": "Compare <strong>melting ice</strong> with <strong>cooking an egg</strong>. Both look different after a change. What makes the changes different?", "type": "text", "placeholder": "Both changes... However...", "model": "Both changes affect the material's appearance. Melting ice is reversible because water can freeze again. Cooking an egg is irreversible because it cannot be returned to raw egg."}, {"label": "SORT IT", "title": "Reversible or irreversible?", "art": "🧂 💧", "body": "Salt dissolves in water. Later, the water evaporates and the salt can be recovered.", "type": "choice", "options": ["Reversible: the salt can be recovered", "Irreversible: the salt is gone forever"], "correct": 0, "correctFeedback": "Correct! Dissolved salt remains in the water and can be recovered.", "retryFeedback": "Think about what remains after the water evaporates."}, {"label": "SORT IT", "title": "Rust detective", "art": "🔩 🟠", "body": "An iron object rusts after reacting with oxygen and moisture. Can it simply be returned to its original iron by reshaping or cooling?", "type": "choice", "options": ["Yes, reversible", "No, irreversible"], "correct": 1, "correctFeedback": "Correct. Rusting produces a different substance.", "retryFeedback": "Rust is not just a change in shape."}, {"label": "EXPLAIN", "title": "What makes a change reversible?", "art": "🔄 🧪", "body": "Scientists don't just label changes. They explain <strong>why</strong> they are reversible or irreversible. Use two examples.", "type": "text", "placeholder": "A change is reversible when... For example...", "model": "A reversible change can be undone so the original substance is recovered, such as water freezing into ice. An irreversible change cannot easily be undone to recover the original material, such as baking cake."}, {"label": "FINAL CHECK", "title": "Your science conclusion", "art": "🌟 🔍", "body": "Compare <strong>melting chocolate</strong> and <strong>baking a biscuit</strong>. Write two sentences explaining what is similar and different.", "type": "text", "placeholder": "Both... The difference is...", "model": "Both involve heating and change the material's appearance. Melting chocolate is generally reversible when it cools and solidifies; baking a biscuit is irreversible because it cannot be turned back into raw dough."}]};
let index=0, points=0, answers={}, checked={};
const $=id=>document.getElementById(id);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
 const q=DATA.steps[index];$('bar').style.width=(index/DATA.steps.length*100)+'%';$('counter').textContent=`Mission ${index+1} of ${DATA.steps.length}`;
 let inner=`<div class="eyebrow">${escapeHtml(q.label||'SCIENCE CHALLENGE')}</div><h1>${escapeHtml(q.title)}</h1>`;
 if(q.art)inner+=`<div class="art" aria-hidden="true">${q.art.split(' ').map(e=>`<span>${e}</span>`).join('')}</div>`;
 if(q.body)inner+=`<p>${q.body}</p>`;
 if(q.scenario)inner+=`<div class="scenario">${q.scenario}</div>`;
 if(q.type==='choice')inner+=`<div class="choices">${q.options.map((o,i)=>`<button class="choice ${answers[index]===i?'selected':''}" onclick="pick(${i})">${o}</button>`).join('')}</div>`;
 if(q.type==='text')inner+=`<textarea class="textanswer" rows="3" placeholder="${escapeHtml(q.placeholder||'Type your thinking here...')}" oninput="answers[index]=this.value">${escapeHtml(answers[index]||'')}</textarea>`;
 if(q.type==='table')inner+=`<div class="tablewrap"><table><thead><tr>${q.columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${q.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><textarea class="textanswer" rows="3" placeholder="What do you notice? Explain using the evidence." oninput="answers[index]=this.value">${escapeHtml(answers[index]||'')}</textarea>`;
 if(q.tip)inner+=`<div class="tip">💡 <strong>Helpful hint:</strong> ${q.tip}</div>`;
 if(checked[index])inner+=`<div class="feedback ${checked[index].ok?'':'try'}">${checked[index].msg}</div>`;
 inner+=`<div class="actions"><button class="secondary" onclick="prev()" ${index===0?'disabled':''}>← Back</button><div>${!checked[index]?`<button class="primary" onclick="check()">Check my thinking ✓</button>`:`<button class="primary" onclick="next()">${index===DATA.steps.length-1?'Finish mission 🏆':'Next mission →'}</button>`}</div></div>`;
 $('panel').innerHTML=inner;
}
function pick(i){if(checked[index])return;answers[index]=i;render();}
function check(){
 let q=DATA.steps[index], a=answers[index];
 if(q.type==='choice'&&a===undefined){alert('Choose an answer first.');return;}
 if(q.type!=='choice'&&(!a||!String(a).trim())){alert('Write a short response before checking.');return;}
 let ok=q.type==='choice'?a===q.correct:true;
 if(ok&&!checked[index])points++;
 checked[index]={ok,msg:(ok?'✅ ':'🔎 ')+(ok?(q.correctFeedback||'Great work!'):(q.retryFeedback||'Have another look.'))+(q.model?`<br><br><strong>Example response:</strong> ${q.model}`:'')};
 render();
}
function next(){if(index<DATA.steps.length-1){index++;render();}else finish();}
function prev(){if(index>0){index--;render();}}
function finish(){
 $('bar').style.width='100%';$('counter').textContent='Mission complete!';
 $('panel').innerHTML=`<div class="eyebrow">MISSION COMPLETE</div><h1>🏆 Science Detective!</h1><div class="art">🔬 🧪 🌟</div><p>You completed ${DATA.steps.length} mini challenges. You earned <strong>${points} mission stars</strong> for completed or correctly answered checks.</p><div class="note">Remember: practise explaining <strong>why</strong> you chose an answer. That is what helps in the assessment.</div><div class="actions"><button class="secondary" onclick="restart()">↻ Try again</button><button class="primary" onclick="window.print()">Print my completion page</button></div>`;
}
function restart(){index=0;points=0;answers={};checked={};render();}
document.addEventListener('DOMContentLoaded',render);
</script></body></html>
